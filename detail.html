<title>非遗时间线 · 丝路拾遗</title>
<style>
:root{
  --ink:#1A1B1C;--sub:#6B6B6B;--line:#C9C9C9;--line-d:#E3E3E3;
  --bg:#FAFAF7;--card:#FFFFFF;--accent:#8A5A3B;--accent-2:#B0895A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:.3rem;line-height:1.6;
}
/* —— 顶栏 —— */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(.4rem + env(safe-area-inset-top)) .3rem .22rem;
  background:rgba(250,250,247,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-d);
}
.back-btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:.26rem;padding:.1rem .24rem;border-radius:999px;cursor:pointer;
}
.brand{font-size:.24rem;color:var(--sub);letter-spacing:.06em;font-weight:600;}
/* —— 头部 —— */
.detail-head{
  padding:calc(1.9rem + env(safe-area-inset-top)) .4rem .5rem;
  text-align:center;
}
.detail-img{
  width:2.6rem;height:2.6rem;margin:0 auto .3rem;border-radius:50%;
  background:#EFEFEA center/cover no-repeat;
  border:2px solid var(--line-d);box-shadow:0 .06rem .16rem rgba(0,0,0,.08);
}
.detail-tag{
  display:inline-block;font-size:.22rem;color:var(--accent);
  border:1px solid rgba(138,90,59,.45);border-radius:999px;
  padding:.03rem .18rem;margin-bottom:.18rem;letter-spacing:.1em;
}
.detail-title{font-size:.52rem;font-weight:700;letter-spacing:.04em;}
.detail-sub{font-size:.26rem;color:var(--sub);margin-top:.12rem;}
/* —— 时间线 —— */
.tl-wrap{padding:.2rem .4rem 1.2rem;}
.tl-stage-title{
  font-size:.26rem;color:var(--sub);text-align:center;margin:.3rem 0 .2rem;
  letter-spacing:.12em;font-weight:600;
}
.tl{
  position:relative;padding-left:.5rem;
}
.tl::before{
  content:"";position:absolute;left:.14rem;top:.1rem;bottom:.1rem;
  width:2px;background:var(--line);border-radius:2px;
}
.tl-item{position:relative;padding:0 0 .44rem .2rem;}
.tl-item:last-child{padding-bottom:.1rem;}
.tl-dot{
  position:absolute;left:-.42rem;top:.1rem;width:.3rem;height:.3rem;border-radius:50%;
  background:#fff;border:3px solid var(--accent-2);
  box-shadow:0 0 0 3px var(--bg);
}
.tl-item.past .tl-dot{border-color:var(--accent);}
.tl-item.gap .tl-dot{border-color:#B8B8B8;}
.tl-item.live .tl-dot{background:var(--accent);border-color:var(--accent);}
.tl-card{
  background:var(--card);border:1px solid var(--line-d);border-radius:.16rem;
  padding:.22rem .26rem .26rem;
  box-shadow:0 .03rem .1rem rgba(0,0,0,.05);
}
.tl-era{
  display:flex;align-items:center;gap:.14rem;margin-bottom:.08rem;
}
.tl-era b{
  font-size:.28rem;color:var(--accent);font-weight:700;white-space:nowrap;
}
.tl-era span{
  font-size:.22rem;color:var(--sub);letter-spacing:.06em;
  border:1px solid var(--line);border-radius:999px;padding:.01rem .14rem;
}
.tl-card p{font-size:.26rem;color:var(--ink);}
.tl-foot{
  text-align:center;color:var(--sub);font-size:.22rem;
  padding:.4rem .4rem calc(.9rem + env(safe-area-inset-bottom));
}
</style>
</head>
